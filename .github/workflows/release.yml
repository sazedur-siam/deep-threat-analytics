name: Release

# Publishes to the Visual Studio Marketplace and Open VSX when a version tag is pushed, e.g. `git tag v0.1.0`.
# The VSIX is packaged once and the same file goes to both registries and the GitHub release.
# Repository secrets (see docs/PUBLISHING.md):
#   VSCE_PAT  Azure DevOps token with the Marketplace > Manage scope
#   OVSX_PAT  Open VSX access token for the MdSazedurRahman namespace
# A registry whose secret is not set is skipped, so a tag still produces the GitHub release with the VSIX.
# --skip-duplicate makes a re-run safe after one registry already accepted this version.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: xvfb-run -a npm run test:integration
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Package
        run: |
          # Odd minor versions are pre-releases (Marketplace convention); vsce marks this at package time.
          # The flag is stored in the VSIX manifest, so both registries read it from the file.
          minor=$(node -p "require('./package.json').version.split('.')[1]")
          if [ $((minor % 2)) -eq 1 ]; then flag=--pre-release; else flag=; fi
          npx vsce package $flag --out deep-threat-analytics.vsix
      - name: Check which registry tokens are configured
        id: tokens
        # Secrets cannot be used in `if:` directly. Only true/false leaves this step, never the token.
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            echo "vsce=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::VSCE_PAT is not set; skipping the Visual Studio Marketplace."
          fi
          if [ -n "$OVSX_PAT" ]; then
            echo "ovsx=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::OVSX_PAT is not set; skipping Open VSX."
          fi
      - name: Publish to the Visual Studio Marketplace
        if: steps.tokens.outputs.vsce == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath deep-threat-analytics.vsix --skip-duplicate
      - name: Publish to Open VSX
        if: steps.tokens.outputs.ovsx == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        # ovsx ignores --pre-release for a prepackaged VSIX; the pre-release flag comes from the VSIX manifest.
        run: npx ovsx publish deep-threat-analytics.vsix --skip-duplicate
      - uses: softprops/action-gh-release@v2
        with:
          files: deep-threat-analytics.vsix
          generate_release_notes: true
