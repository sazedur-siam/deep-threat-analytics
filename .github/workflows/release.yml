name: Release

# Publishes to the Visual Studio Marketplace when a version tag is pushed, e.g. `git tag v0.1.0`.
# Requires the repository secret VSCE_PAT (Azure DevOps token with Marketplace > Manage scope).
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: xvfb-run -a npm run test:integration
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Package
        run: |
          # Odd minor versions are pre-releases (Marketplace convention); vsce marks this at package time.
          minor=$(node -p "require('./package.json').version.split('.')[1]")
          if [ $((minor % 2)) -eq 1 ]; then flag=--pre-release; else flag=; fi
          npx vsce package $flag --out deep-threat-analytics.vsix
      - name: Publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath deep-threat-analytics.vsix
      - uses: softprops/action-gh-release@v2
        with:
          files: deep-threat-analytics.vsix
          generate_release_notes: true
