# Access to credentials and other sensitive files on the developer's machine.
- id: secrets-fs/ssh-keys
  title: Accesses SSH keys
  category: secrets-fs
  severity: medium
  languages: ['*']
  match:
    any:
      - regex: '\.ssh[/\\]+(id_|authorized_keys)'
      - regex: '\bid_(rsa|ed25519|ecdsa|dsa)\b'
    scope: line
  message: '{package} references SSH private keys in {file}'

- id: secrets-fs/cloud-credentials
  title: Accesses cloud credentials
  category: secrets-fs
  severity: low
  languages: ['*']
  match:
    any:
      - regex: '\.aws[/\\]+credentials'
      - regex: '\.azure[/\\]+(accessTokens|msal_token_cache)'
      - regex: 'application_default_credentials\.json'
      - regex: '\.kube[/\\]+config'
      - regex: '\.docker[/\\]+config\.json'
    scope: line
  message: '{package} references cloud or cluster credentials in {file}'

- id: secrets-fs/package-manager-tokens
  title: Accesses package registry or git tokens
  category: secrets-fs
  severity: medium
  languages: ['*']
  match:
    any:
      - regex: '[''"`/\\]\.(npmrc|pypirc|netrc|git-credentials|yarnrc\.yml)\b'
    scope: line
  message: '{package} references registry or git credentials files in {file}'

- id: secrets-fs/browser-data
  title: Reads browser passwords or cookies
  category: secrets-fs
  severity: high
  languages: ['*']
  match:
    all:
      - regex: 'Google[/\\]+Chrome|Chromium|BraveSoftware|Microsoft[/\\]+Edge|Mozilla[/\\]+Firefox|\.mozilla|Opera Software'
      - regex: 'Login Data|Local State|logins\.json|key4\.db|cookies\.sqlite|[/\\]Cookies\b'
    scope: file
  message: '{package} reads browser credential or cookie stores in {file}'

- id: secrets-fs/macos-keychain
  title: Reads the macOS keychain
  category: secrets-fs
  severity: high
  languages: ['*']
  match:
    any:
      - regex: '\bsecurity\s+(find-generic-password|find-internet-password|dump-keychain)\b'
      - regex: 'login\.keychain(-db)?\b'
    scope: line
  message: '{package} reads the macOS keychain in {file}'

- id: secrets-fs/system-shadow
  title: Reads system password hashes
  category: secrets-fs
  severity: high
  languages: ['*']
  match:
    any:
      - regex: '/etc/shadow\b'
      - regex: '\\config\\SAM\b'
    scope: line
  message: '{package} references system password hashes in {file}'

- id: secrets-fs/crypto-wallets
  title: Accesses cryptocurrency wallets
  category: secrets-fs
  severity: high
  languages: ['*']
  match:
    any:
      - regex: '\bwallet\.dat\b'
      - regex: 'exodus\.wallet|Electrum[/\\]+wallets|Ethereum[/\\]+keystore|solana[/\\]+id\.json'
      - regex: 'nkbihfbeogaeaoehlefnkodbefgpgknn'
    scope: line
  message: '{package} references cryptocurrency wallet files in {file}'
