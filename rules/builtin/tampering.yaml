# Shai-Hulud style: use a stolen GitHub token to create a repo and push loot into it, or to
# register a self-hosted runner. Requires a token read AND a write-style request (POST/PUT or a
# create/update SDK call), so read-only API clients that fetch file contents do not match.
- id: exfiltration/github-api-abuse
  title: Uses a GitHub token to create repos, push files or register runners
  category: exfiltration
  severity: high
  languages: [javascript, typescript, python, go, rust, php, java]
  match:
    all:
      - regex: 'https?://[^\s''"`]*/user/repos\b|[''"`]/user/repos[''"`]|/repos/[^\s''"]*/contents/|/actions/secrets\b|/actions/runners/registration-token\b|/orgs/[^\s''"]*/actions/runners\b|\b(createForAuthenticatedUser|createOrUpdateFileContents|createRegistrationTokenFor(Repo|Org)|createOrUpdate(Repo|Org)Secret|listRepoSecrets|getRepoPublicKey)\b|\.create_repo\s*\('
      - regex: '\b(GITHUB_TOKEN|GH_TOKEN|GITHUB_PAT|GH_ENTERPRISE_TOKEN)\b|\bgh[pousr]_[A-Za-z0-9]{4}|\bgithub_pat_|\bgh\s+auth\s+token\b|[''"`]gh[''"`]\s*,\s*\[?\s*[''"`]auth[''"`]|[''"`/\\]\.git-credentials\b|\bgh[/\\]+hosts\.yml\b'
      - regex: '[''"`](PUT|POST)[''"`]|\.(put|post|PUT|POST)\s*\(|\bhttp\.Method(Put|Post)\b|\bMethod::(PUT|POST)\b|\bCURLOPT_(POST|CUSTOMREQUEST)\b|\b(createForAuthenticatedUser|createOrUpdateFileContents|createRegistrationTokenFor(Repo|Org)|createOrUpdate(Repo|Org)Secret)\b|\.create_repo\s*\('
    scope: file
  message: '{package} uses a GitHub token to create repositories, push files or register runners in {file}'
