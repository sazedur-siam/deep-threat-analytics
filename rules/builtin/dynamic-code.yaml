# Turning data into running code.
- id: dynamic-code/eval-non-literal
  title: Evaluates dynamically built code
  category: dynamic-code
  severity: medium
  languages: [javascript, typescript]
  match:
    any:
      - regex: '(^|[^.\w])eval\s*\(\s*[^''"`)\s]'
      - regex: '\bnew\s+Function\s*\(\s*[^''"`)\s]'
    scope: line
  message: '{package} evaluates code that is not a fixed string in {file}'

- id: dynamic-code/vm-run
  title: Runs code in a VM context
  category: dynamic-code
  severity: medium
  languages: [javascript, typescript]
  match:
    any:
      - regex: '\bvm\.(runInNewContext|runInThisContext|runInContext|compileFunction)\s*\('
      - regex: '\bnew\s+vm\.Script\s*\('
    scope: line
  message: '{package} compiles and runs code with the vm module in {file}'

- id: dynamic-code/module-compile
  title: Compiles a module from a string
  category: dynamic-code
  severity: medium
  languages: [javascript, typescript]
  match:
    any:
      - regex: '\._compile\s*\(\s*[^)]'
    scope: line
  message: '{package} compiles module source from a string in {file}'

- id: dynamic-code/decode-and-execute
  title: Decodes and executes hidden code
  category: dynamic-code
  severity: critical
  languages: [javascript, typescript, python]
  match:
    any:
      - regex: '\b(eval|Function)\s*\(\s*(Buffer\.from|atob\s*\(|unescape\s*\(|decodeURIComponent\s*\()'
      - regex: '\b(exec|eval)\s*\(\s*(base64\.|b64decode|zlib\.decompress|marshal\.loads|codecs\.decode|bytes\.fromhex|__import__\s*\(\s*[''"](base64|zlib|marshal|codecs)[''"])'
      - regex: '\bexec\s*\(\s*compile\s*\(\s*(base64|zlib|marshal|codecs|bytes)'
    scope: line
  message: '{package} decodes data and executes it as code in {file}'

- id: dynamic-code/python-exec-non-literal
  title: Executes dynamically built code
  category: dynamic-code
  severity: medium
  languages: [python]
  match:
    any:
      - regex: '(^|[^.\w])(exec|eval)\s*\(\s*[^''"\s)]'
    not:
      # setup.py commonly does exec(open("pkg/version.py").read()) to read __version__.
      - regex: '\bexec\s*\(\s*open\s*\('
      - regex: '\b(exec|eval)\s*\(\s*(base64\.|b64decode|zlib|marshal|codecs|bytes\.fromhex|__import__|compile\s*\(\s*(base64|zlib|marshal|codecs|bytes))'
    scope: line
  message: '{package} executes code that is not a fixed string in {file}'

- id: dynamic-code/marshal-loads
  title: Loads marshalled bytecode
  category: dynamic-code
  severity: medium
  languages: [python]
  match:
    any:
      - regex: '\bmarshal\.loads\s*\('
    scope: line
  message: '{package} loads marshalled Python bytecode in {file}'

- id: dynamic-code/python-hidden-import
  title: Imports sensitive modules indirectly
  category: dynamic-code
  severity: medium
  languages: [python]
  match:
    any:
      - regex: '__import__\s*\(\s*[''"](os|subprocess|socket|base64|zlib|marshal|codecs|ctypes|pty)[''"]\s*\)'
    scope: line
  message: '{package} hides imports of sensitive modules behind __import__ in {file}'

- id: dynamic-code/go-plugin-load
  title: Loads a compiled plugin at runtime
  category: dynamic-code
  severity: medium
  languages: [go]
  match:
    any:
      - regex: '\bplugin\.Open\('
    scope: line
  message: '{package} loads a compiled Go plugin at runtime in {file}'

- id: dynamic-code/rust-dynamic-library
  title: Loads a native library at runtime
  category: dynamic-code
  severity: medium
  languages: [rust]
  match:
    any:
      - regex: '\blibloading::Library::new\(|\bdlopen\('
    scope: line
  message: '{package} loads a native library at runtime in {file}'

- id: dynamic-code/php-eval
  title: Evaluates dynamically built code
  category: dynamic-code
  severity: medium
  languages: [php]
  match:
    any:
      - regex: '(^|[^>\w$:])(eval|assert)\s*\(\s*\$'
      - regex: '\bcreate_function\s*\('
      - regex: '\bpreg_replace\s*\(\s*[''"]/.*/[a-z]*e[a-z]*[''"]'
    scope: line
  message: '{package} evaluates code that is not a fixed string in {file}'

- id: dynamic-code/php-decode-execute
  title: Decodes and executes hidden code
  category: dynamic-code
  severity: critical
  languages: [php]
  match:
    any:
      - regex: '\b(eval|assert)\s*\(\s*(base64_decode|gzinflate|gzuncompress|gzdecode|str_rot13|hex2bin|convert_uudecode)\s*\('
    scope: line
  message: '{package} decodes data and executes it as code in {file}'

- id: dynamic-code/php-request-exec
  title: Executes code or commands from web requests
  category: dynamic-code
  severity: critical
  languages: [php]
  match:
    any:
      - regex: '\b(eval|assert|system|shell_exec|passthru|exec|popen|proc_open)\s*\(\s*\$_(GET|POST|REQUEST|COOKIE|SERVER)\b'
    scope: line
  message: '{package} passes request data straight into code or command execution (web shell) in {file}'
